services:
  - type: web
    name: localpulse-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_NAME
        value: localpulse
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: SARVAM_STT_MODEL
        value: saaras:v4
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
